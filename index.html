<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRG Stock Analyzer — NIFTY50</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
    input[type="range"] { accent-color: #2563eb; cursor: pointer; height: 4px; }
    select option { background: #ffffff; color: #0f172a; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .btn-primary {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff; border: none; cursor: pointer;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
      transition: all 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg,#1e40af,#1d4ed8); box-shadow: 0 4px 20px rgba(37,99,235,0.45); }
    .btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; }
    .input-field {
      background: #f8fafc; border: 1.5px solid #e2e8f0; color: #0f172a;
      border-radius: 10px; padding: 9px 14px; font-size: 13.5px;
      outline: none; width: 100%; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef } = React;

    /* ── NIFTY 50 default tickers (Yahoo Finance NSE suffix) ─────── */
    const NIFTY50_TICKERS =
      'RELIANCE.NS,TCS.NS,HDFCBANK.NS,INFY.NS,ICICIBANK.NS,' +
      'HINDUNILVR.NS,ITC.NS,SBIN.NS,BHARTIARTL.NS,KOTAKBANK.NS,' +
      'LT.NS,AXISBANK.NS,BAJFINANCE.NS,ASIANPAINT.NS,MARUTI.NS,' +
      'TITAN.NS,SUNPHARMA.NS,HCLTECH.NS,WIPRO.NS,NTPC.NS';

    /* ── maths ───────────────────────────────────────────────────── */
    function rollingMean(arr, w) {
      return arr.map((_, i) => {
        if (i < w - 1) return null;
        const s = arr.slice(i - w + 1, i + 1).filter(v => v != null && !isNaN(v));
        return s.length === w ? s.reduce((a, b) => a + b, 0) / w : null;
      });
    }

    function calcRRG(aligned, w) {
      const rs    = aligned.map(d => d.s / d.b);
      const rsRM  = rollingMean(rs, w);
      const ratio = rs.map((v, i) => rsRM[i] != null ? (v / rsRM[i]) * 100 : null);
      const ratRM = rollingMean(ratio, w);
      const mom   = ratio.map((v, i) => v != null && ratRM[i] != null ? (v / ratRM[i]) * 100 : null);
      return aligned
        .map((d, i) => ({ date: d.date, x: ratio[i], y: mom[i] }))
        .filter(d => d.x != null && d.y != null);
    }

    /* ── period → interval + label mapping ──────────────────────── */
    const PERIOD_CONFIG = {
      '1d':  { interval: '5m',  dateKey: 'datetime', label: '1 Day (5-min bars)'   },
      '5d':  { interval: '30m', dateKey: 'datetime', label: '1 Week (30-min bars)' },
      '1mo': { interval: '1d',  dateKey: 'date',     label: '1 Month'              },
      '3mo': { interval: '1d',  dateKey: 'date',     label: '3 Months'             },
      '6mo': { interval: '1d',  dateKey: 'date',     label: '6 Months'             },
      '1y':  { interval: '1d',  dateKey: 'date',     label: '1 Year'               },
      '2y':  { interval: '1d',  dateKey: 'date',     label: '2 Years'              },
    };

    /* ── data fetching ───────────────────────────────────────────── */
    async function fetchYahoo(ticker, period) {
      const { interval } = PERIOD_CONFIG[period] || { interval: '1d' };
      const base = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=${interval}&range=${period}`;
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(base)}`,
        `https://corsproxy.io/?${encodeURIComponent(base)}`,
      ];
      let lastErr;
      for (const url of proxies) {
        try {
          const r = await fetch(url, { signal: AbortSignal.timeout(13000) });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const json = await r.json();
          const res = json?.chart?.result?.[0];
          if (!res) throw new Error('No data in response');
          const ts = res.timestamp;
          const closes = res.indicators.quote[0].close;
          // For intraday use full datetime string as key; for daily use date only
          const isIntraday = interval !== '1d';
          const pairs = ts
            .map((t, i) => ({
              date: isIntraday
                ? new Date(t * 1000).toISOString().slice(0, 16)  // "2024-01-01T09:15"
                : new Date(t * 1000).toISOString().slice(0, 10), // "2024-01-01"
              close: closes[i],
            }))
            .filter(p => p.close != null && !isNaN(p.close));
          if (!pairs.length) throw new Error('Empty price series');
          return pairs;
        } catch (e) { lastErr = e; }
      }
      throw new Error(lastErr?.message ?? 'fetch failed');
    }

    /* auto-cap smoothing so it never exceeds floor(dataLen / 3) */
    function effectiveSmoothing(dataLen, requested) {
      return Math.max(2, Math.min(requested, Math.floor(dataLen / 3)));
    }

    function alignPrices(bench, stock) {
      const bm = new Map(bench.map(d => [d.date, d.close]));
      return stock
        .filter(d => bm.has(d.date))
        .map(d => ({ date: d.date, s: d.close, b: bm.get(d.date) }));
    }

    /* ── quadrant logic ──────────────────────────────────────────── */
    function quadrant(x, y) {
      if (x >= 100 && y >= 100) return 'Leading';
      if (x >= 100 && y <  100) return 'Weakening';
      if (x <  100 && y <  100) return 'Lagging';
      return 'Improving';
    }

    const QCOLORS = {
      Leading:  '#16a34a',
      Weakening:'#ea580c',
      Lagging:  '#dc2626',
      Improving:'#2563eb',
    };
    const QBG = {
      Leading:  'rgba(22,163,74,0.09)',
      Weakening:'rgba(234,88,12,0.09)',
      Lagging:  'rgba(220,38,38,0.09)',
      Improving:'rgba(37,99,235,0.09)',
    };

    const PALETTE = [
      '#2563eb','#db2777','#059669','#d97706','#7c3aed',
      '#dc2626','#0891b2','#ea580c','#4f46e5','#16a34a',
      '#be185d','#0369a1','#b45309','#6d28d9','#047857',
      '#9333ea','#0284c7','#c2410c','#1d4ed8','#15803d',
    ];

    const SIGNALS = {
      Leading:   '↗ Outperforming with rising momentum',
      Improving: '↑ Gaining relative strength — watch for breakout',
      Weakening: '↘ Losing momentum — consider trimming',
      Lagging:   '↙ Underperforming benchmark — avoid / reduce',
    };

    /* ── main component ──────────────────────────────────────────── */
    function App() {
      const [tickers,   setTickers]   = useState(NIFTY50_TICKERS);
      const [bench,     setBench]     = useState('^NSEI');
      const [period,    setPeriod]    = useState('6mo');
      const [smoothing, setSmoothing] = useState(14);
      const [tail,      setTail]      = useState(5);
      const [loading,   setLoading]   = useState(false);
      const [errors,    setErrors]    = useState([]);
      const [rows,      setRows]      = useState([]);
      const [hasChart,  setHasChart]  = useState(false);
      const [chartMeta, setChartMeta] = useState({ bench: '', w: 14, t: 5 });
      const plotEl = useRef(null);

      const generate = useCallback(async () => {
        setLoading(true);
        setErrors([]);
        setRows([]);

        const list = [...new Set(
          tickers.split(',').map(t => t.trim().toUpperCase()).filter(Boolean)
        )];
        if (!list.length) { setLoading(false); return; }

        /* fetch benchmark */
        let benchData;
        try {
          benchData = await fetchYahoo(bench.trim().toUpperCase(), period);
        } catch (e) {
          setErrors([`Benchmark (${bench}): ${e.message}`]);
          setLoading(false);
          return;
        }

        /* fetch all stocks */
        const settled = await Promise.allSettled(list.map(t => fetchYahoo(t, period)));

        const errs = [], traces = [], tableRows = [];
        const allX = [], allY = [];

        settled.forEach((res, idx) => {
          const tk = list[idx];
          if (res.status === 'rejected') {
            errs.push(`${tk}: ${res.reason?.message ?? 'failed'}`); return;
          }
          const aligned = alignPrices(benchData, res.value);
          if (aligned.length < 6) {
            errs.push(`${tk}: insufficient overlapping data`); return;
          }
          const w = effectiveSmoothing(aligned.length, smoothing);
          const rrg = calcRRG(aligned, w);
          if (rrg.length < tail + 1) {
            errs.push(`${tk}: insufficient RRG data`); return;
          }

          const seg   = rrg.slice(-tail);
          const color = PALETTE[idx % PALETTE.length];
          const last  = seg[seg.length - 1];
          const q     = quadrant(last.x, last.y);

          seg.forEach(d => { allX.push(d.x); allY.push(d.y); });

          /* tail trace */
          traces.push({
            type: 'scatter', mode: 'lines+markers',
            x: seg.map(d => d.x),
            y: seg.map(d => d.y),
            name: tk.replace('.NS','').replace('.BO',''),
            legendgroup: tk,
            line: { color, width: 2.5 },
            marker: {
              size:  seg.map((_, i) => 4 + (i / (seg.length - 1 || 1)) * 9),
              color: seg.map((_, i) => {
                const a = Math.round((0.3 + (i / (seg.length - 1 || 1)) * 0.7) * 255)
                  .toString(16).padStart(2, '0');
                return color + a;
              }),
              line: { width: 0 },
            },
            text: seg.map(d => {
              const label = tk.replace('.NS','').replace('.BO','');
              const qq = quadrant(d.x, d.y);
              return `<b>${label}</b><br>Date: ${d.date}<br>RS-Ratio: <b>${d.x.toFixed(3)}</b><br>RS-Momentum: <b>${d.y.toFixed(3)}</b><br>Quadrant: <b>${qq}</b>`;
            }),
            hovertemplate: '%{text}<extra></extra>',
            hoverlabel: { bgcolor: '#ffffff', bordercolor: color, font: { color: '#0f172a', size: 12 } },
          });

          /* label at latest point */
          const label = tk.replace('.NS','').replace('.BO','');
          traces.push({
            type: 'scatter', mode: 'text',
            x: [last.x], y: [last.y],
            text: [label],
            textposition: 'top center',
            textfont: { color, size: 10.5, family: 'monospace' },
            showlegend: false, hoverinfo: 'skip', legendgroup: tk,
          });

          tableRows.push({ tk, label, x: last.x.toFixed(3), y: last.y.toFixed(3), q, color });
        });

        if (!allX.length) {
          setErrors([...errs, 'No valid data to plot.']);
          setLoading(false);
          return;
        }

        /* axis ranges */
        const pad = arr => Math.max((Math.max(...arr) - Math.min(...arr)) * 0.22, 2.5);
        const xp = pad(allX), yp = pad(allY);
        const xMin = Math.min(...allX) - xp, xMax = Math.max(...allX) + xp;
        const yMin = Math.min(...allY) - yp, yMax = Math.max(...allY) + yp;

        const layout = {
          paper_bgcolor: '#ffffff',
          plot_bgcolor:  '#f8fafc',
          font: { color: '#334155', family: '"Segoe UI", system-ui, sans-serif', size: 12 },
          xaxis: {
            title: { text: 'RS-Ratio →', font: { size: 13, color: '#64748b' } },
            range: [xMin, xMax],
            gridcolor: '#e2e8f0', gridwidth: 1,
            zerolinecolor: '#cbd5e1',
            tickfont: { color: '#94a3b8', size: 11 },
            linecolor: '#e2e8f0',
          },
          yaxis: {
            title: { text: 'RS-Momentum ↑', font: { size: 13, color: '#64748b' } },
            range: [yMin, yMax],
            gridcolor: '#e2e8f0', gridwidth: 1,
            zerolinecolor: '#cbd5e1',
            tickfont: { color: '#94a3b8', size: 11 },
            linecolor: '#e2e8f0',
          },
          shapes: [
            /* quadrant backgrounds */
            { type:'rect', x0:100, x1:xMax, y0:100, y1:yMax, fillcolor:QBG.Leading,   line:{width:0} },
            { type:'rect', x0:100, x1:xMax, y0:yMin, y1:100, fillcolor:QBG.Weakening, line:{width:0} },
            { type:'rect', x0:xMin, x1:100, y0:yMin, y1:100, fillcolor:QBG.Lagging,   line:{width:0} },
            { type:'rect', x0:xMin, x1:100, y0:100, y1:yMax, fillcolor:QBG.Improving, line:{width:0} },
            /* crosshair */
            { type:'line', x0:100, x1:100, y0:yMin, y1:yMax, line:{color:'#94a3b8', width:1.5, dash:'dot'} },
            { type:'line', x0:xMin, x1:xMax, y0:100, y1:100, line:{color:'#94a3b8', width:1.5, dash:'dot'} },
          ],
          annotations: [
            { x: xMax-xp*0.15, y: yMax-yp*0.15, text:'LEADING',   showarrow:false, font:{color:QCOLORS.Leading,   size:12, family:'monospace', weight:'bold'} },
            { x: xMax-xp*0.15, y: yMin+yp*0.15, text:'WEAKENING', showarrow:false, font:{color:QCOLORS.Weakening, size:12, family:'monospace', weight:'bold'} },
            { x: xMin+xp*0.15, y: yMin+yp*0.15, text:'LAGGING',   showarrow:false, font:{color:QCOLORS.Lagging,   size:12, family:'monospace', weight:'bold'} },
            { x: xMin+xp*0.15, y: yMax-yp*0.15, text:'IMPROVING', showarrow:false, font:{color:QCOLORS.Improving, size:12, family:'monospace', weight:'bold'} },
          ],
          legend: {
            bgcolor: '#f8fafc', bordercolor: '#e2e8f0', borderwidth: 1,
            font: { color: '#475569', size: 10.5 },
            x: 1.01, xanchor: 'left',
          },
          margin: { t: 30, r: 130, b: 60, l: 70 },
          hovermode: 'closest',
        };

        Plotly.react(plotEl.current, traces, layout, { responsive: true, displayModeBar: false });
        setHasChart(true);
        setErrors(errs);
        setRows(tableRows);
        const { label: periodLabel } = PERIOD_CONFIG[period] || { label: period };
        setChartMeta({ bench: bench.toUpperCase(), w: smoothing, t: tail, period: periodLabel });
        setLoading(false);
      }, [tickers, bench, period, smoothing, tail]);

      /* ── render ───────────────────────────────────────────────── */
      return (
        <div className="min-h-screen p-4 md:p-6" style={{ background: '#f1f5f9' }}>
          <div className="max-w-screen-xl mx-auto space-y-4">

            {/* ── Header ── */}
            <div className="text-center py-3">
              <div className="inline-flex items-center gap-2 mb-2">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                <h1 className="text-3xl font-bold" style={{ color: '#0f172a', letterSpacing: '-0.5px' }}>
                  RRG Stock Analyzer
                </h1>
              </div>
              <p className="text-sm" style={{ color: '#64748b' }}>
                Relative Rotation Graph · NIFTY 50 · Powered by Yahoo Finance
              </p>
            </div>

            {/* ── Controls ── */}
            <div className="card p-5 shadow-sm">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">

                <div className="sm:col-span-2 lg:col-span-2">
                  <label className="label">
                    Stock Tickers
                    <span style={{ color: '#94a3b8', fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>
                      &nbsp;· comma-separated · use .NS suffix for NSE stocks
                    </span>
                  </label>
                  <input
                    className="input-field font-mono"
                    value={tickers}
                    onChange={e => setTickers(e.target.value)}
                    placeholder="RELIANCE.NS, TCS.NS, INFY.NS ..."
                  />
                </div>

                <div>
                  <label className="label">Benchmark</label>
                  <input
                    className="input-field font-mono"
                    value={bench}
                    onChange={e => setBench(e.target.value)}
                    placeholder="^NSEI"
                  />
                  <p className="text-xs mt-1" style={{ color: '#94a3b8' }}>
                    ^NSEI = NIFTY 50 &nbsp;·&nbsp; ^BSESN = SENSEX
                  </p>
                </div>

                <div>
                  <label className="label">Time Period</label>
                  <select
                    className="input-field"
                    value={period}
                    onChange={e => setPeriod(e.target.value)}
                  >
                    <option value="1d">1 Day</option>
                    <option value="5d">1 Week</option>
                    <option value="1mo">1 Month</option>
                    <option value="3mo">3 Months</option>
                    <option value="6mo">6 Months</option>
                    <option value="1y">1 Year</option>
                    <option value="2y">2 Years</option>
                  </select>
                </div>

                <div>
                  <label className="label">
                    Smoothing Window &nbsp;
                    <span style={{ color: '#2563eb', fontWeight: 800 }}>{smoothing} days</span>
                  </label>
                  <input type="range" min="5" max="50" step="1"
                    value={smoothing} onChange={e => setSmoothing(+e.target.value)}
                    className="w-full mt-2" />
                  <div className="flex justify-between text-xs mt-1" style={{ color: '#94a3b8' }}>
                    <span>5d</span><span>50d</span>
                  </div>
                </div>

                <div>
                  <label className="label">
                    Tail Length &nbsp;
                    <span style={{ color: '#2563eb', fontWeight: 800 }}>{tail} days</span>
                  </label>
                  <input type="range" min="2" max="20" step="1"
                    value={tail} onChange={e => setTail(+e.target.value)}
                    className="w-full mt-2" />
                  <div className="flex justify-between text-xs mt-1" style={{ color: '#94a3b8' }}>
                    <span>2d</span><span>20d</span>
                  </div>
                </div>

                <div className="flex items-end">
                  <button
                    className="btn-primary w-full rounded-xl py-3 px-6 text-sm font-bold"
                    onClick={generate} disabled={loading}
                  >
                    {loading
                      ? <span className="flex items-center justify-center gap-2">
                          <svg className="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                          </svg>
                          Fetching Data…
                        </span>
                      : '⚡  Generate RRG'
                    }
                  </button>
                </div>

              </div>
            </div>

            {/* ── Preset chips ── */}
            <div className="flex flex-wrap gap-2 px-1">
              {[
                { label: 'NIFTY 50 (Top 20)', val: NIFTY50_TICKERS, b: '^NSEI' },
                { label: 'IT Sector', val: 'TCS.NS,INFY.NS,WIPRO.NS,HCLTECH.NS,TECHM.NS,LTIM.NS,PERSISTENT.NS,COFORGE.NS', b: '^NSEI' },
                { label: 'Banking', val: 'HDFCBANK.NS,ICICIBANK.NS,SBIN.NS,KOTAKBANK.NS,AXISBANK.NS,INDUSINDBK.NS,BANDHANBNK.NS', b: '^NSEI' },
                { label: 'US Big Tech', val: 'AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA', b: 'SPY' },
              ].map(p => (
                <button key={p.label}
                  onClick={() => { setTickers(p.val); setBench(p.b); }}
                  className="text-xs px-3 py-1.5 rounded-full font-medium transition-all"
                  style={{
                    background: '#e0e7ff', color: '#3730a3',
                    border: '1px solid #c7d2fe',
                  }}
                  onMouseOver={e => e.currentTarget.style.background = '#c7d2fe'}
                  onMouseOut={e => e.currentTarget.style.background = '#e0e7ff'}
                >
                  {p.label}
                </button>
              ))}
            </div>

            {/* ── Errors ── */}
            {errors.length > 0 && (
              <div className="rounded-xl p-4 text-sm space-y-1 fade-in"
                style={{ background: '#fff7ed', border: '1px solid #fed7aa', color: '#9a3412' }}>
                <div className="font-semibold mb-1">⚠ Some tickers had issues:</div>
                {errors.map((e, i) => <div key={i} className="font-mono text-xs">• {e}</div>)}
              </div>
            )}

            {/* ── Loading ── */}
            {loading && (
              <div className="flex flex-col items-center justify-center py-16 gap-5 fade-in card shadow-sm">
                <div className="relative w-16 h-16">
                  <div className="spin absolute inset-0 rounded-full border-4 border-transparent"
                    style={{ borderTopColor: '#2563eb' }}></div>
                  <div className="spin absolute inset-2 rounded-full border-4 border-transparent"
                    style={{ borderTopColor: '#93c5fd', animationDirection: 'reverse', animationDuration: '0.7s' }}></div>
                </div>
                <div className="text-center">
                  <div className="font-semibold" style={{ color: '#1e40af' }}>Fetching Market Data</div>
                  <div className="text-sm mt-1" style={{ color: '#64748b' }}>
                    Pulling prices from Yahoo Finance via CORS proxy…
                  </div>
                </div>
              </div>
            )}

            {/* ── Chart ── */}
            <div className="card shadow-sm fade-in overflow-hidden" style={{ display: hasChart ? 'block' : 'none' }}>
              {/* chart header bar */}
              <div className="px-5 py-3 border-b flex items-center justify-between flex-wrap gap-2"
                style={{ borderColor: '#e2e8f0', background: '#f8fafc' }}>
                <div className="flex items-center gap-3 flex-wrap">
                  {['Leading','Weakening','Lagging','Improving'].map(q => (
                    <span key={q} className="flex items-center gap-1.5 text-xs font-semibold" style={{ color: QCOLORS[q] }}>
                      <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: QCOLORS[q] }}></span>
                      {q}
                    </span>
                  ))}
                </div>
                <span className="text-xs" style={{ color: '#94a3b8' }}>
                  Benchmark: <b style={{ color: '#475569' }}>{chartMeta.bench}</b>
                  &nbsp;·&nbsp; Period: <b style={{ color: '#475569' }}>{chartMeta.period}</b>
                  &nbsp;·&nbsp; Window: <b style={{ color: '#475569' }}>{chartMeta.w}</b>
                  &nbsp;·&nbsp; Tail: <b style={{ color: '#475569' }}>{chartMeta.t}</b>
                </span>
              </div>
              <div ref={plotEl} style={{ width: '100%', height: '580px' }} />
            </div>

            {/* ── Empty state ── */}
            {!hasChart && !loading && (
              <div className="flex flex-col items-center justify-center py-20 gap-4 card shadow-sm fade-in">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" strokeWidth="1.5">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="8 12 12 8 16 12"/>
                  <line x1="12" y1="8" x2="12" y2="16"/>
                </svg>
                <div className="text-center">
                  <div className="font-semibold text-base" style={{ color: '#94a3b8' }}>Chart will appear here</div>
                  <div className="text-sm mt-1" style={{ color: '#cbd5e1' }}>
                    Select tickers and click <b>Generate RRG</b> to begin
                  </div>
                </div>
              </div>
            )}

            {/* ── Data Table ── */}
            {rows.length > 0 && (
              <div className="card shadow-sm overflow-hidden fade-in">
                <div className="px-5 py-3 border-b flex items-center justify-between"
                  style={{ background: '#f8fafc', borderColor: '#e2e8f0' }}>
                  <span className="font-semibold text-sm" style={{ color: '#374151' }}>Latest Positions</span>
                  <span className="text-xs" style={{ color: '#94a3b8' }}>{rows.length} stocks</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr style={{ background: '#f1f5f9', color: '#64748b' }}>
                        <th className="px-5 py-3 text-left font-semibold uppercase text-xs tracking-wider">Ticker</th>
                        <th className="px-5 py-3 text-right font-semibold uppercase text-xs tracking-wider">RS-Ratio</th>
                        <th className="px-5 py-3 text-right font-semibold uppercase text-xs tracking-wider">RS-Momentum</th>
                        <th className="px-5 py-3 text-center font-semibold uppercase text-xs tracking-wider">Quadrant</th>
                        <th className="px-5 py-3 text-left font-semibold uppercase text-xs tracking-wider hidden md:table-cell">Signal</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows
                        .slice()
                        .sort((a, b) => {
                          const order = ['Leading', 'Improving', 'Weakening', 'Lagging'];
                          return order.indexOf(a.q) - order.indexOf(b.q);
                        })
                        .map((row, i) => {
                          const qc = QCOLORS[row.q];
                          return (
                            <tr key={row.tk}
                              style={{ background: i % 2 === 0 ? '#ffffff' : '#f8fafc', borderTop: '1px solid #f1f5f9' }}>
                              <td className="px-5 py-3 font-mono font-bold text-sm" style={{ color: row.color }}>
                                {row.label}
                                <span className="font-normal text-xs ml-1" style={{ color: '#94a3b8' }}>
                                  {row.tk.includes('.NS') ? '.NS' : row.tk.includes('.BO') ? '.BO' : ''}
                                </span>
                              </td>
                              <td className="px-5 py-3 text-right font-mono" style={{ color: '#0f172a' }}>{row.x}</td>
                              <td className="px-5 py-3 text-right font-mono" style={{ color: '#0f172a' }}>{row.y}</td>
                              <td className="px-5 py-3 text-center">
                                <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold"
                                  style={{
                                    background: qc + '18',
                                    color: qc,
                                    border: `1px solid ${qc}40`,
                                  }}>
                                  {row.q}
                                </span>
                              </td>
                              <td className="px-5 py-3 text-xs hidden md:table-cell" style={{ color: '#64748b' }}>
                                {SIGNALS[row.q]}
                              </td>
                            </tr>
                          );
                        })
                      }
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ── Footer ── */}
            <div className="text-center text-xs pb-6" style={{ color: '#cbd5e1' }}>
              Data via Yahoo Finance &nbsp;·&nbsp;
              RS-Ratio = (RS / SMA(RS, w)) × 100 &nbsp;·&nbsp;
              RS-Momentum = (RS-Ratio / SMA(RS-Ratio, w)) × 100
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
